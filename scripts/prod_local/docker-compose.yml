# A local stand-in for the Render deployment in render.yaml. Started by
# scripts/prod_local.sh — do not run it directly, the database has to be
# built by scripts/render_bootstrap_db.sh between "db up" and "api up".
#
#   render.yaml                       here
#   ---------------------------------------------------------------
#   aanga-db   (Postgres 17, empty)   db    plain postgres:17, no init scripts
#   aanga-cache (Key Value)           redis
#   aanga-api  (backend/Dockerfile)   api   the same image, FLASK_ENV=production
#   aanga-web  (static + rewrites)    web   frontend/dist + the same rewrites
#
# One difference: Render keeps images in Supabase Storage. No Supabase keys are
# used here, so the API is allowed to keep uploads on a volume
# (ALLOW_LOCAL_UPLOADS) and the web tier forwards /static/uploads to it.
name: aanga-prodlocal

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: aanga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/prod_local.sh}
      POSTGRES_DB: aanga
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${PRODLOCAL_DB_PORT:-55440}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aanga -d aanga"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file:
      - ../../.prodlocal/env
    environment:
      FLASK_ENV: production
      PORT: "8000"
      DATABASE_URL: postgresql://aanga:${POSTGRES_PASSWORD}@db:5432/aanga
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      FRONTEND_ORIGIN: http://localhost:${PRODLOCAL_PORT:-8080}
      SITE_URL: http://localhost:${PRODLOCAL_PORT:-8080}
      JWT_COOKIE_SAMESITE: Lax
      # One proxy in front: the web tier below, which appends X-Forwarded-For.
      TRUSTED_PROXY_COUNT: "1"
      WEB_CONCURRENCY: "2"
      GUNICORN_THREADS: "4"
      ALLOW_LOCAL_UPLOADS: "true"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 3s
      timeout: 5s
      retries: 40
    volumes:
      - uploads:/app/static/uploads

  web:
    image: node:22-alpine
    command: ["node", "/srv/static_server.mjs"]
    environment:
      DIST: /srv/dist
      PORT: "8080"
      API_ORIGIN: http://api:8000
    ports:
      - "127.0.0.1:${PRODLOCAL_PORT:-8080}:8080"
    depends_on:
      api: { condition: service_healthy }
    volumes:
      - ../../frontend/dist:/srv/dist:ro
      - ./static_server.mjs:/srv/static_server.mjs:ro

volumes:
  pgdata:
  uploads:

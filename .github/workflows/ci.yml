name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    # A Postgres service container, which is allowed *here* and nowhere else:
    # local development uses the Neon dev branch and has no containers at all.
    # Two reasons CI keeps one rather than using the Neon test branch:
    #   * concurrent runs would fight over a single shared branch, and every
    #     test TRUNCATEs every table;
    #   * a fork's pull request cannot read repository secrets, so a Neon URL
    #     would make CI fail for outside contributors.
    #
    # To run against Neon instead: delete the `services:` block, set
    # TEST_DATABASE_URL from a repository secret holding the *test* branch's
    # pooled string, add TEST_DIRECT_DATABASE_URL for the direct one, and reset
    # the branch first (scripts/reset_test_branch.sh --reset-only). Do that only
    # on `push`, never on `pull_request`.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aanga_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # conftest rebuilds the schema from schema.sql against this database.
      # Not a Neon host, so the "is this really the test branch?" guard in
      # conftest has nothing to protect and stands aside.
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/aanga_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Keep in step with backend/.python-version and PYTHON_VERSION in
          # render.yaml.
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx oxlint
      - run: npm run build

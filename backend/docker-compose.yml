# Persistent Postgres for AANGA — the self-hosted replacement for Supabase's
# managed database.
#
#   docker compose up -d db          # start (initialises schema on first run)
#   docker compose logs -f db        # watch initialisation
#   docker compose down              # stop, keep data
#   docker compose down -v           # stop and DESTROY the data volume
#
# Not to be confused with docker-compose.test.yml, which runs a throwaway
# in-RAM database for pytest on port 55432.
#
# Required in backend/.env:
#   POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
#   DATABASE_URL   built from the same values (see .env.example)

name: aanga

services:
  db:
    # 17.x matches the Supabase server schema.sql was dumped from, so enum
    # types, generated columns and trigger semantics behave identically.
    # 17.6+ is required: the dump contains \restrict meta-commands that older
    # psql builds reject.
    image: postgres:17
    container_name: aanga-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in backend/.env}
      # Supabase runs UTC. Keeping the same avoids every timestamp shifting
      # by the host offset after the data migration.
      TZ: UTC
      PGTZ: UTC
    ports:
      # 5432 and 5433 are commonly taken by a local Postgres install; 55432 is
      # the pytest database. Override with POSTGRES_PORT if 55433 clashes too.
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

      # Ordered initialisation. These run ONCE, only when the data volume is
      # empty — editing them later has no effect on an existing database.
      #   00  clears the stock `public` schema so the dump's own CREATE SCHEMA
      #       succeeds, and stubs the Supabase roles.
      #   01  the Supabase compatibility shims, shared verbatim with the test
      #       suite so there is a single source of truth.
      #   02  the canonical schema dump.
      - ./db/init/00_bootstrap.sql:/docker-entrypoint-initdb.d/00_bootstrap.sql:ro
      - ./tests/sql/00_prereqs.sql:/docker-entrypoint-initdb.d/01_supabase_compat.sql:ro
      - ./schema.sql:/docker-entrypoint-initdb.d/02_schema.sql:ro

      # Dump/restore working directory, shared with the host (gitignored).
      - ./db/backups:/backups
    healthcheck:
      # -h forces a TCP check: during initialisation the entrypoint runs a
      # temporary server on the unix socket only, so this correctly reports
      # unhealthy until schema.sql has finished loading.
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  pgdata:
    name: aanga-pgdata

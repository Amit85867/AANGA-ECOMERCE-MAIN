# Ephemeral Postgres for the test suite.
#   docker compose -f docker-compose.test.yml up -d
#   pytest
#   docker compose -f docker-compose.test.yml down
#
# Runs on host port 55432 to avoid clashing with any local Postgres.
services:
  test-db:
    # Pinned to the same major as the dev/production container (and the
    # Supabase server schema.sql was dumped from), so tests cannot pass on a
    # Postgres version the real database never runs.
    image: postgres:17
    container_name: aanga-test-pg
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: aanga_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data   # keep the test DB in RAM; nothing to persist
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

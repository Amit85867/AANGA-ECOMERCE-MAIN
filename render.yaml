# Render Blueprint — AANGA
#
# Layout (a): a static site serves the storefront and rewrites /api/* to the
# backend, so the browser only ever talks to one origin. That keeps the login
# refresh cookie first-party, which the storefront's CSRF handling relies on.
#
# The database is NOT defined here: it is Neon (see docs/DATABASE.md). Set
# DATABASE_URL and DIRECT_DATABASE_URL in the Dashboard from the Neon
# *production* branch. Nothing in this repository holds a production string.
#
# There is no Docker anywhere: the API runs on Render's native Python runtime.
#
# Nothing here deploys by itself: create it from the Render Dashboard with
# New -> Blueprint, pointed at this repository. Before the first sync:
#
#   1. Replace every "aanga-api.onrender.com" below with the backend's real
#      URL if Render assigns a different one (it appends a suffix when the
#      name is taken). The rewrite destinations cannot reference a service by
#      name, so they are literal URLs.
#   2. Replace "www.example.com" with the storefront's custom domain.
#   3. Fill in every `sync: false` value in the Dashboard. They are secrets and
#      are deliberately not in this file.
#   4. Load the schema into the Neon production branch once:
#        scripts/render_bootstrap_db.sh        (see docs/DATABASE.md)
#
# Plans are the smallest that suit a live store. Free web services sleep when
# idle, which would make Razorpay's webhook time out — do not use them here.
#
# Validate after editing:  render blueprints validate   (Render CLI)

envVarGroups:
  # Shared by the web service and the cron job so the two can never drift.
  - name: aanga-backend
    envVars:
      - key: FLASK_ENV
        value: production

      # Pin the interpreter. Render also honours backend/.python-version;
      # both are set so neither can drift silently.
      - key: PYTHON_VERSION
        value: "3.12.7"

      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true

      # ── Neon ────────────────────────────────────────────────
      # From the Neon *production* branch (docs/DATABASE.md):
      #   DATABASE_URL        -> pooled  ("-pooler" in the host). The app.
      #   DIRECT_DATABASE_URL -> direct. Migrations, dumps, DDL.
      # Never load a schema over the pooled string: schema.sql is a pg_dump and
      # sets search_path to '', which PgBouncer then leaves on the server
      # connection for whoever gets it next.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false

      # Public origin of the storefront (the custom domain on the static site).
      - key: FRONTEND_ORIGIN
        value: https://www.example.com
      - key: SITE_URL
        value: https://www.example.com

      # Same-origin through the rewrite, so the strict setting works. Would
      # have to be "None" only if the storefront called the API cross-site.
      - key: JWT_COOKIE_SAMESITE
        value: Lax

      # Number of proxies between a storefront visitor and the app: the static
      # site's /api rewrite plus the API's own load balancer. Render does not
      # document the figure, so "1" is a starting value, not a known one.
      # After the first deploy open admin → System Health through the
      # storefront domain: "Proxies in front of the server" shows how many
      # it saw. Set this to that number and redeploy.
      - key: TRUSTED_PROXY_COUNT
        value: "1"

      # Rate-limit counters. Blank = per-worker in-memory counters, which with
      # two workers means roughly double the advertised allowance and nothing
      # shared between instances. Upstash's free tier is plenty; paste its
      # redis:// (or rediss://) URL here. See docs/DEPLOYMENT.md.
      - key: RATELIMIT_STORAGE_URI
        sync: false

      # Product images. Required: the service refuses to start without them
      # (Render's disk is ephemeral, so local uploads would vanish on deploy).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: product-images

      # First master admin, created on first boot. Change the password
      # afterwards with:  flask --app run set-admin-password
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # Online payments. Leave all three blank to launch COD-only. Once the key
      # is set, the secret and the webhook secret are required.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # Courier. Leave blank to launch without booking or delivery checks.
      - key: SHIPROCKET_EMAIL
        sync: false
      - key: SHIPROCKET_PASSWORD
        sync: false
      - key: SHIPROCKET_PICKUP_LOCATION
        value: Primary
      - key: SHIPROCKET_PICKUP_PINCODE
        sync: false

      # Email. Blank = emails are logged, not sent.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

      # Sizing. Neon's pooled endpoint allows 10,000 connections, so the pool
      # is no longer the binding constraint; these are sized for the instance's
      # memory instead. See docs/DEPLOYMENT.md "Sizing".
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_THREADS
        value: "4"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"

services:
  # ── API ─────────────────────────────────────────────────────
  - type: web
    name: aanga-api
    runtime: python
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    # gthread workers: a request spends most of its time waiting on Postgres or
    # an upstream API, so a few threads per worker serve several at once
    # without the memory of extra processes.
    # keep-alive is longer than the load balancer's idle timeout (typically
    # 60 s): with gunicorn's default of 2 s the proxy reuses a connection the
    # worker has just closed, and that reaches the visitor as a 502.
    startCommand: >-
      gunicorn -b 0.0.0.0:$PORT -k gthread
      -w ${WEB_CONCURRENCY:-2} --threads ${GUNICORN_THREADS:-4}
      --timeout 60 --graceful-timeout 30
      --keep-alive ${GUNICORN_KEEPALIVE:-75} --access-logfile - run:app
    # /api/ping answers without touching the database, so the health check does
    # not keep the Neon compute awake (and does not bill CU-hours for nothing).
    healthCheckPath: /api/ping
    autoDeploy: false
    envVars:
      - fromGroup: aanga-backend

  # ── Refund abandoned checkouts ──────────────────────────────
  # The webhook ignores captures younger than 15 minutes, so refunds for
  # abandoned checkouts depend on this job running.
  - type: cron
    name: aanga-reconcile-payments
    runtime: python
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    schedule: "*/30 * * * *"
    startCommand: flask --app run reconcile-payments --hours 24
    autoDeploy: false
    envVars:
      - fromGroup: aanga-backend
      # One short-lived process: a single connection is all it needs.
      - key: DB_POOL_SIZE
        value: "1"
      - key: DB_MAX_OVERFLOW
        value: "1"

  # ── Storefront ──────────────────────────────────────────────
  - type: web
    name: aanga-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: false
    domains:
      - www.example.com
    envVars:
      # Deliberately no VITE_API_BASE_URL: the app then calls /api on its own
      # origin and the rewrite below carries it to the backend.
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_ENVIRONMENT
        value: production
    routes:
      # Order matters: the first matching rule wins, and the SPA fallback at
      # the bottom matches everything.
      - type: rewrite
        source: /api/*
        destination: https://aanga-api.onrender.com/api/*
      - type: rewrite
        source: /sitemap.xml
        destination: https://aanga-api.onrender.com/sitemap.xml
      - type: rewrite
        source: /robots.txt
        destination: https://aanga-api.onrender.com/robots.txt
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Built assets are content-hashed, so they can be cached for a year.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # index.html must not be cached, or a deploy is not picked up.
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
